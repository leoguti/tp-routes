<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🕵️ Revisar ruta</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root{--bg:#0f1020;--pan:#1a1c34;--acc:#4dd4ff;--txt:#eef}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  #top{padding:10px 14px;text-align:center}
  #top h1{margin:0;font-size:1.15rem} #top .sub{color:#9aa0c8;font-size:.85rem}
  #map{height:calc(100vh - 120px)}
  #lista{max-width:760px;margin:10px auto;padding:0 12px}
  .rt{display:block;background:var(--pan);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:var(--txt);text-decoration:none;font-weight:600}
  .rt:hover{outline:2px solid var(--acc)}
  .veredicto{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:var(--pan);padding:10px 16px;border-radius:24px;font-size:.9rem;z-index:1000;box-shadow:0 4px 16px #0008}
  .veredicto b{color:var(--acc)}
  .lbl-parada{background:#fff;color:#111;font-weight:800;font-size:12px;border:none;box-shadow:0 1px 4px #0006;padding:2px 6px}
  #btn-viaje{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:1200;background:linear-gradient(90deg,#38d996,#4dd4ff);color:#012;border:none;border-radius:26px;padding:14px 26px;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 6px 20px #0009;display:none}
  #inspec{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:1300;background:var(--pan);border-radius:16px;padding:16px 18px;width:340px;max-width:92vw;box-shadow:0 8px 30px #000b;display:none;text-align:center}
  #inspec .pn{font-size:1.25rem;font-weight:800;margin:4px 0 10px}
  #inspec .pregunta{color:#9aa0c8;font-size:.9rem;margin-bottom:12px}
  #inspec .botones{display:flex;gap:10px}
  #inspec .botones button{flex:1;border:none;border-radius:12px;padding:12px;font-weight:800;font-size:.95rem;cursor:pointer}
  .b-ok{background:#38d996;color:#012} .b-mal{background:#ff5d6c;color:#fff}
  #fin{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:1300;background:linear-gradient(90deg,#ffd43b,#ff8a00);color:#211;border-radius:16px;padding:16px 22px;font-weight:800;display:none;text-align:center;box-shadow:0 8px 30px #000b}
  .bus-icon{font-size:26px;filter:drop-shadow(0 2px 3px #0009)}
  #chat-btn{position:fixed;right:16px;bottom:16px;z-index:1200;background:#4dd4ff;color:#012;border:none;border-radius:50%;width:58px;height:58px;font-size:1.6rem;cursor:pointer;box-shadow:0 4px 16px #0008}
  #chat-panel{position:fixed;right:16px;bottom:84px;z-index:1200;width:320px;max-width:92vw;height:420px;background:var(--pan);border-radius:14px;box-shadow:0 8px 30px #000a;display:none;flex-direction:column;overflow:hidden}
  #chat-head{background:#23264a;padding:10px 14px;font-weight:700;font-size:.95rem}
  #chat-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
  .cmsg{max-width:85%;padding:8px 11px;border-radius:12px;font-size:.88rem;line-height:1.35;white-space:pre-wrap}
  .cmsg.claude{background:#fff;color:#123;align-self:flex-start}
  .cmsg.yo{background:#4dd4ff;color:#012;align-self:flex-end}
  #chat-foot{display:flex;gap:6px;padding:8px;background:#15172c}
  #chat-in{flex:1;padding:9px 12px;border-radius:10px;border:1px solid #334;background:#0d0e1c;color:var(--txt);font-family:inherit}
  #chat-send{background:#4dd4ff;color:#012;border:none;border-radius:10px;padding:0 14px;font-weight:800;cursor:pointer}
  #chat-nombres{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow-y:auto}
  .cn{background:#23264a;color:var(--txt);border:none;border-radius:10px;padding:12px;cursor:pointer;font-size:.9rem}
  .cn:hover{outline:2px solid #4dd4ff}
</style>
</head>
<body>
<div id="top"><h1>🕵️ Revisar ruta</h1><div class="sub" id="sub">¿El camino tiene sentido? ¿Hace algo raro?</div></div>
<div id="lista" style="display:none"></div>
<div id="map" style="display:none"></div>
<button id="btn-viaje">🚌 ¡Iniciar viaje de inspección!</button>
<div id="inspec">
  <div>🚏 Llegamos a la parada</div>
  <div class="pn" id="inspec-nombre">…</div>
  <div class="pregunta">Mira el mapa: ¿la parada está en el punto correcto de la ruta?</div>
  <div class="botones">
    <button class="b-ok" id="b-ok">✅ Está bien</button>
    <button class="b-mal" id="b-mal">🚨 Está mal</button>
  </div>
</div>
<div id="fin"></div>
<button id="chat-btn" title="Chatea con Claude">💬</button>
<div id="chat-panel">
  <div id="chat-head">💬 Tutor Claude</div>
  <div id="chat-nombres"></div>
  <div id="chat-msgs" style="display:none"></div>
  <div id="chat-foot" style="display:none">
    <input id="chat-in" placeholder="Escribe y Enter…">
    <button id="chat-send">➤</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
(function(){
const params = new URLSearchParams(location.search);
const id = params.get('id');
const REGION='boyaca';

async function lista(){
  document.getElementById('lista').style.display='block';
  document.getElementById('sub').textContent='Elige una ruta trazada para revisarla';
  const [rs, shapes] = await Promise.all([
    fetch(`/api/routes?region=${REGION}`).then(r=>r.json()),
    fetch(`/api/route-shapes?region=${REGION}`).then(r=>r.json()).catch(()=>({shapes:[]}))
  ]);
  const conShape = new Set((shapes.shapes||shapes||[]).map(s=>s.route_id));
  const box=document.getElementById('lista');
  (rs.routes||[]).filter(r=>conShape.has(r.id)).forEach(r=>{
    const a=document.createElement('a');
    a.className='rt'; a.href='?id='+r.id;
    a.textContent = `Ruta ${r.id} · ${r.origen_text} → ${r.destino_text}  (${r.operator_nombre||''})`;
    box.appendChild(a);
  });
  if(!box.children.length) box.textContent='No hay rutas trazadas aún.';
}

let mapRef=null, coordsRuta=[], paradasRuta=[], bus=null, busIdx=0, paradaActual=null, reportes=[];
function d2(a,b){ const dx=a[0]-b[0], dy=a[1]-b[1]; return dx*dx+dy*dy; }
async function ver(){
  document.getElementById('map').style.display='block';
  
  const [shape, ruta] = await Promise.all([
    fetch(`/api/route-shapes?route_id=${id}`).then(r=>r.json()),
    fetch(`/api/routes?id=${id}`).then(r=>r.json())
  ]);
  document.querySelector('#top h1').textContent = `🕵️ Ruta ${id}`;
  document.getElementById('sub').textContent = `${ruta.origen_text} → ${ruta.destino_text} (${ruta.operator_nombre||''})`;
  const map=L.map('map'); mapRef=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OSM',maxZoom:19}).addTo(map);
  const gj = shape.geojson || (shape.shapes&&shape.shapes[0]&&shape.shapes[0].geojson);
  if(gj){
    const capa=L.geoJSON(gj,{style:{color:'#4dd4ff',weight:5,opacity:.9}}).addTo(map);
    map.fitBounds(capa.getBounds(),{padding:[30,30]});
    coordsRuta = gj.geometry.coordinates.map(c=>[c[1],c[0]]);
  } else {
    document.getElementById('sub').textContent += ' · ⚠️ sin trazado';
  }
  // TODAS las paradas de la ruta (origen → waypoints en orden → destino), numeradas
  const placesData = await fetch(`/api/places?region=${REGION}`).then(r=>r.json()).catch(()=>({places:[]}));
  const porId = {};
  (placesData.places||[]).forEach(p=>{ porId[p.id]={la:p.lat,lo:p.lon}; });
  const seq=[];
  if(ruta.origen_place_id && porId[ruta.origen_place_id]) seq.push({n:ruta.origen_text,...porId[ruta.origen_place_id]});
  (ruta.waypoints||[]).forEach(w=>{ if(w.place_id && porId[w.place_id]) seq.push({n:w.nombre_text,...porId[w.place_id]}); });
  if(ruta.destino_place_id && porId[ruta.destino_place_id]) seq.push({n:ruta.destino_text,...porId[ruta.destino_place_id]});
  seq.forEach((p,i)=>{
    L.circleMarker([p.la,p.lo],{radius:10,color:'#fff',weight:2,fillColor:'#ffd43b',fillOpacity:1})
      .bindTooltip(`${i+1}. ${p.n}`,{permanent:true,direction:'top',className:'lbl-parada'}).addTo(map);
  });
  if(!seq.length) document.getElementById('sub').textContent += ' · (paradas sin ubicar)';
  if(coordsRuta.length && seq.length){
    paradasRuta = seq.map(p=>{
      let best=0,bd=Infinity;
      coordsRuta.forEach((c,i)=>{ const dd=d2(c,[p.la,p.lo]); if(dd<bd){bd=dd;best=i;} });
      return {...p, idx:best, hecho:false};
    }).sort((a,b)=>a.idx-b.idx);
    document.getElementById('btn-viaje').style.display='block';
  }
}

// ---- Chat integrado (mismos canales ntfy de siempre) ----
const CANALES = {
  "Brayan":"brayan-claude-chat-2026junio10","Peña":"pena-claude-chat-2026junio10",
  "Nadia":"nadia-claude-chat-2026junio10","Ana María":"anamaria-claude-chat-2026junio10",
  "Yosef":"yosef-claude-chat-2026junio10","Stefania":"stefania-claude-chat-2026junio10",
  "Edward":"edward-claude-chat-2026julio17","David":"dai-claude-chat-2026mayo21",
  "Cristian":"cristian-claude-chat-2026junio10","Santiago":"santiago-claude-chat-2026mayo06"
};
const TITULOS = {
  "Brayan":"brayan","Peña":"pena","Nadia":"nadia","Ana María":"anamaria","Yosef":"yosef",
  "Stefania":"stefania","Edward":"edward","David":"dai","Cristian":"cristian","Santiago":"santiago"
};
let miNombre = localStorage.getItem('tp_chat_nombre') || null;
let fuente = null;
const panel=document.getElementById('chat-panel'), msgs=document.getElementById('chat-msgs'),
      foot=document.getElementById('chat-foot'), nombres=document.getElementById('chat-nombres'),
      entrada=document.getElementById('chat-in');
const vistos=new Set();
function addMsg(cls,txt){ const d=document.createElement('div'); d.className='cmsg '+cls; d.textContent=txt; msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight; }
function pintarChat(m,hist){
  if(!m||m.event!=='message'||(m.id&&vistos.has(m.id)))return;
  if(m.id)vistos.add(m.id);
  const t=(m.title||'').toLowerCase();
  if(t==='claude') addMsg('claude',m.message);
  else if(hist&&t===TITULOS[miNombre]) addMsg('yo',m.message);
}
function conectarChat(){
  nombres.style.display='none'; msgs.style.display='flex'; foot.style.display='flex';
  document.getElementById('chat-head').textContent='💬 '+miNombre+' — Tutor Claude';
  const base='https://ntfy.envs.net/'+CANALES[miNombre];
  fetch(base+'/json?poll=1&since=1h').then(r=>r.text()).then(tx=>{
    tx.trim().split(/\n/).forEach(l=>{ if(l){ try{ pintarChat(JSON.parse(l),true); }catch(e){} } });
  }).catch(()=>{});
  if(fuente)fuente.close();
  fuente=new EventSource(base+'/sse');
  fuente.onmessage=ev=>{ try{ pintarChat(JSON.parse(ev.data),false); }catch(e){} };
}
let alElegir=null;
function elegirNombre(cb){
  alElegir = cb || null;
  panel.style.display='flex';
  nombres.style.display='grid'; msgs.style.display='none'; foot.style.display='none';
  nombres.innerHTML='';
  Object.keys(CANALES).forEach(n=>{
    const b=document.createElement('button'); b.className='cn'; b.textContent=n;
    b.onclick=()=>{ miNombre=n; localStorage.setItem('tp_chat_nombre',n); conectarChat(); if(alElegir){const f=alElegir; alElegir=null; f();} };
    nombres.appendChild(b);
  });
}
async function enviarChat(){
  const txt=entrada.value.trim(); if(!txt||!miNombre)return;
  entrada.value=''; addMsg('yo',txt);
  // contexto automático: el chat sabe en qué ruta está el estudiante
  const cuerpo = id ? `[Ruta ${id}] ${txt}` : txt;
  try{ await fetch('https://ntfy.envs.net/'+CANALES[miNombre],{method:'POST',headers:{'Title':TITULOS[miNombre]},body:cuerpo}); }catch(e){}
}
document.getElementById('chat-btn').onclick=()=>{
  panel.style.display = panel.style.display==='flex' ? 'none' : 'flex';
  if(panel.style.display==='flex'){ if(miNombre)conectarChat(); else elegirNombre(); }
};
document.getElementById('chat-send').onclick=enviarChat;
entrada.addEventListener('keydown',e=>{ if(e.key==='Enter')enviarChat(); });

// ---- Viaje de inspección (bus animado) ----
function pasoBus(){
  if(busIdx>=coordsRuta.length){ finViaje(); return; }
  bus.setLatLng(coordsRuta[busIdx]);
  mapRef.panTo(coordsRuta[busIdx],{animate:false});
  const p=paradasRuta.find(q=>!q.hecho && busIdx>=q.idx);
  if(p){ paradaActual=p; mapRef.setView([p.la,p.lo],14);
    document.getElementById('inspec-nombre').textContent=p.n;
    document.getElementById('inspec').style.display='block'; return; }
  busIdx+=2;
  setTimeout(pasoBus,30);
}
function responder(ok){
  const p=paradaActual; p.hecho=true;
  document.getElementById('inspec').style.display='none';
  reportes.push({n:p.n,ok});
  enviarNtfyViaje(ok ? `✅ Parada "${p.n}" está BIEN ubicada (viaje de inspección)` : `🚨 Parada "${p.n}" está MAL ubicada (viaje de inspección)`);
  busIdx+=2; setTimeout(pasoBus,400);
}
function finViaje(){
  const ok=reportes.filter(r=>r.ok).length, mal=reportes.length-ok;
  const f=document.getElementById('fin');
  f.innerHTML=`🏁 ¡Viaje completado!<br>Inspeccionaste ${reportes.length} paradas: ✅ ${ok} bien · 🚨 ${mal} con problema<br><span style="font-size:.8rem">Tu reporte ya le llegó a Claude 💬</span>`;
  f.style.display='block';
  enviarNtfyViaje(`🏁 Viaje de inspección completado: ${reportes.length} paradas (✅${ok} 🚨${mal})`);
}
async function enviarNtfyViaje(texto){
  if(!miNombre)return;
  const cuerpo = id ? `[Ruta ${id}] ${texto}` : texto;
  try{ await fetch('https://ntfy.envs.net/'+CANALES[miNombre],{method:'POST',headers:{'Title':TITULOS[miNombre]},body:cuerpo}); }catch(e){}
}
document.getElementById('btn-viaje').onclick=()=>{
  const arrancar=()=>{
    document.getElementById('btn-viaje').style.display='none';
    document.getElementById('fin').style.display='none';
    if(!bus) bus=L.marker(coordsRuta[0],{icon:L.divIcon({className:'bus-icon',html:'🚌',iconSize:[26,26],iconAnchor:[13,13]})}).addTo(mapRef);
    busIdx=0; reportes=[]; paradasRuta.forEach(p=>p.hecho=false);
    mapRef.setView(coordsRuta[0],13);
    pasoBus();
  };
  if(!miNombre){ elegirNombre(()=>{ panel.style.display='none'; arrancar(); }); }
  else arrancar();
};
document.getElementById('b-ok').onclick=()=>responder(true);
document.getElementById('b-mal').onclick=()=>responder(false);

if(id) ver(); else lista();
})();
</script>
</body>
</html>
